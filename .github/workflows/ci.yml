name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: pip install -r requirements.txt
      # Hosted runners have no microphone and no whisper-cli; the audio
      # tests are tagged in tests/conftest.py and skipped here.
      - run: python -m pytest -q -m "not audio"
